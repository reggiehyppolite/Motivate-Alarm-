name: MotivateAlarm
options:
  bundleIdPrefix: com.motivatealarm
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

packages:
  SpotifyiOS:
    url: https://github.com/spotify/ios-sdk
    branch: master

targets:
  MotivateAlarm:
    type: application
    platform: iOS
    sources:
      - MotivateAlarm
    resources:
      - MotivateAlarm/Resources
    info:
      path: MotivateAlarm/Support/Info.plist
      properties:
        CFBundleDisplayName: Motivate Alarm
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        NSAlarmKitUsageDescription: "Motivate Alarm wakes you at the time you set with the song or podcast you choose."
        NSUserNotificationsUsageDescription: "Used to display alarm and timer alerts."
        LSApplicationQueriesSchemes:
          - spotify
        CFBundleURLTypes:
          - CFBundleURLName: com.motivatealarm.spotify
            CFBundleURLSchemes:
              - motivatealarm
        SpotifyClientID: $(SPOTIFY_CLIENT_ID)
        SpotifyRedirectURL: motivatealarm://spotify-callback
    entitlements:
      path: MotivateAlarm/Support/MotivateAlarm.entitlements
      properties:
        com.apple.developer.alarmkit: YES
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.motivatealarm.MotivateAlarm
    dependencies:
      - package: SpotifyiOS
        product: SpotifyiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.motivatealarm.MotivateAlarm
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
